name: MarketHub AI · Web build y Android demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Generar APK Android de depuración (sin firma comercial)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  web:
    name: Validar versión web
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar interfaz
        run: npm run build
      - name: Guardar web compilada
        uses: actions/upload-artifact@v4
        with:
          name: markethub-web-demo
          path: dist/
          retention-days: 7

  android:
    name: APK Android de prueba
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar y generar proyecto Android
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Generar APK de depuración
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: markethub-android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
