name: MarketHub AI · QA visual responsive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'scripts/visual-qa.mjs'
      - 'scripts/cross-browser-qa.mjs'
      - 'scripts/splash-responsive-qa.mjs'
      - 'scripts/media-forge-qa.mjs'
      - 'scripts/unified-backup-qa.mjs'
      - 'scripts/studio-draft-qa.mjs'
      - 'scripts/mobile-ux-qa.mjs'
      - 'scripts/pulse-campaign-qa.mjs'
      - 'scripts/marketing-engines-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'assets/**'
      - 'scripts/visual-qa.mjs'
      - 'scripts/cross-browser-qa.mjs'
      - 'scripts/splash-responsive-qa.mjs'
      - 'scripts/media-forge-qa.mjs'
      - 'scripts/unified-backup-qa.mjs'
      - 'scripts/studio-draft-qa.mjs'
      - 'scripts/mobile-ux-qa.mjs'
      - 'scripts/pulse-campaign-qa.mjs'
      - 'scripts/marketing-engines-qa.mjs'
      - '.github/workflows/visual-qa.yml'

# Evita acumular pruebas lentas de revisiones ya sustituidas en main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y navegador de pruebas
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --save-exact playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Arrancar interfaz local
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/markethub-vite.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/markethub-vite.log
          exit 1
      - name: Comprobar banners de carga completos en Chromium y Safari WebKit
        run: node scripts/splash-responsive-qa.mjs
      - name: Revisar inicio, estudio y menús por tamaños de pantalla
        run: node scripts/visual-qa.mjs
      - name: Revisar Safari WebKit Firefox y pantallas horizontales/UHD
        run: node scripts/cross-browser-qa.mjs
      - name: Comprobar diálogos buscador y ajustes responsive en Chromium y Safari
        run: node scripts/mobile-ux-qa.mjs
      - name: Comprobar PULSE Campaign Pilot y siete borradores sin exceder FREE
        run: node scripts/pulse-campaign-qa.mjs
      - name: Verificar cuatro motores de marketing en PC, iPad y Safari móvil
        run: node scripts/marketing-engines-qa.mjs
      - name: Verificar límite FREE y PRO desde Estudio en Chromium y Safari
        run: node scripts/studio-draft-qa.mjs
      - name: Comprobar Media Forge y PULSE PACK en navegadores
        run: node scripts/media-forge-qa.mjs
      - name: Verificar copia integral y recuperación no destructiva en Chromium y Safari
        run: node scripts/unified-backup-qa.mjs
      - name: Guardar capturas y resultados incluso si hay diferencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markethub-visual-qa
          path: |
            visual-qa/
            browser-qa/
          retention-days: 14
          if-no-files-found: warn
